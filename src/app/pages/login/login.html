<div class="login-container">

  <mat-card class="login-card">

    <div class="logo-container">
      <span class="logo-icon">📦</span>
      <h1>Inventory AI</h1>
      <p>Sistema de Inventario para Pequeños Negocios</p>
    </div>

    <mat-card-content>

      <mat-form-field appearance="outline" class="full-width">

        <mat-label>Correo electrónico</mat-label>

        <input
          matInput
          placeholder="ejemplo@empresa.com"
          [(ngModel)]="email">

      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">

        <mat-label>Contraseña</mat-label>

        <input
          matInput
          type="password"
          [(ngModel)]="password">

      </mat-form-field>

      <button
        mat-raised-button
        color="primary"
        class="login-button"
        (click)="ingresarSistema()">

        Iniciar sesión

      </button>

    </mat-card-content>

  </mat-card>

</div>
