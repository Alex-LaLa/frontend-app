<mat-card>
  <mat-card-header>
    <div class="header-categorias">
      <div class="titulo-categorias">
        <mat-card-title> Categorías </mat-card-title>

        <mat-card-subtitle> Organiza tus productos por grupos </mat-card-subtitle>
      </div>

      <div class="acciones-header">
        <span class="contador"> {{ categorias.length }} categorías </span>

        <button mat-raised-button color="primary" (click)="abrirDialogoCategoria()">
          <mat-icon> add </mat-icon>
          Nueva Categoría
        </button>
      </div>
    </div>
  </mat-card-header>
  <mat-card-content>
    <table mat-table [dataSource]="categorias">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>

        <td mat-cell *matCellDef="let categoria">
          {{ categoria.id }}
        </td>
      </ng-container>

      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>

        <td mat-cell *matCellDef="let categoria">
          {{ categoria.nombre }}
        </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>

        <td mat-cell *matCellDef="let categoria">
          <button mat-icon-button color="primary">
            <mat-icon> edit </mat-icon>
          </button>

          <button mat-icon-button color="warn">
            <mat-icon> delete </mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnas"></tr>

      <tr mat-row *matRowDef="let row; columns: columnas"></tr>
    </table>
  </mat-card-content>
</mat-card>
