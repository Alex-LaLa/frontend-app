<h2 mat-dialog-title>

  <mat-icon color="warn">
    warning
  </mat-icon>

  Confirmar eliminación

</h2>


<mat-dialog-content>


  <p>

    ¿Deseas eliminar {{ data.tipo }}?

  </p>


  <div class="elemento-eliminar">

    <strong>

      {{ data.nombre }}

    </strong>

  </div>


  @if(data.mensaje){

    <p class="mensaje">

      {{ data.mensaje }}

    </p>

  }


</mat-dialog-content>



<mat-dialog-actions align="end">


  <button
    mat-button
    (click)="cancelar()">

    Cancelar

  </button>



  <button
    mat-raised-button
    color="warn"
    (click)="confirmar()">


    <mat-icon>

      delete

    </mat-icon>


    Eliminar


  </button>


</mat-dialog-actions>
