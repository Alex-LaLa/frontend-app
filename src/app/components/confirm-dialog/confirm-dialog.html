<h2 mat-dialog-title>

    <mat-icon color="warn">warning</mat-icon>

    Confirmar eliminación

</h2>

<mat-dialog-content>

    <p>

        ¿Deseas eliminar el producto?

    </p>

    <strong>

        {{ data.nombre }}

    </strong>

</mat-dialog-content>

<mat-dialog-actions align="end">

    <button
        mat-button
        (click)="cancelar()">

        Cancelar

    </button>

    <button
        mat-raised-button
        color="warn"
        (click)="confirmar()">

        Eliminar

    </button>

</mat-dialog-actions>
