<h2 mat-dialog-title>

  {{ editando ? 'Editar Producto' : 'Nuevo Producto' }}

</h2>


<mat-dialog-content class="dialog-content">

  <!-- Nombre -->

  <mat-form-field appearance="outline">

    <mat-label>Nombre</mat-label>

    <input
      matInput
      [(ngModel)]="producto.nombre"
      placeholder="Ej. Coca-Cola 600ml">

  </mat-form-field>


  <!-- Categoría -->

  <mat-form-field appearance="outline">

    <mat-label>Categoría</mat-label>

    <mat-select [(ngModel)]="producto.categoria">

      <mat-option
        *ngFor="let categoria of categorias"
        [value]="categoria">

        {{ categoria.nombre }}

      </mat-option>

    </mat-select>

  </mat-form-field>


  <!-- Precio -->

  <mat-form-field appearance="outline">

    <mat-label>Precio</mat-label>

    <input
      matInput
      type="number"
      [(ngModel)]="producto.precio">

    <span matTextPrefix>$&nbsp;</span>

  </mat-form-field>


  <!-- Cantidad -->

  <mat-form-field appearance="outline">

    <mat-label>Cantidad disponible</mat-label>

    <input
      matInput
      type="number"
      min="0"
      [(ngModel)]="inventario.unidadesDisponibles">

  </mat-form-field>


  <!-- Nivel de reorden -->

  <mat-form-field appearance="outline">

    <mat-label>Nivel de reorden</mat-label>

    <input
      matInput
      type="number"
      min="0"
      [(ngModel)]="inventario.nivelReorden">

  </mat-form-field>


  <!-- Activo -->

  <mat-checkbox [(ngModel)]="producto.activo">

    Producto activo

  </mat-checkbox>

</mat-dialog-content>


<mat-dialog-actions align="end">

  <button
    mat-button
    (click)="cancelar()">

    Cancelar

  </button>


  <button
    mat-raised-button
    color="primary"
    (click)="guardar()">

    {{ editando ? 'Guardar cambios' : 'Guardar' }}

  </button>

</mat-dialog-actions>
