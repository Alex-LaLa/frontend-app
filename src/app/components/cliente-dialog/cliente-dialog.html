<h2 mat-dialog-title>

  {{ cliente.id ? 'Editar Cliente' : 'Nuevo Cliente' }}

</h2>

<mat-dialog-content>

  <mat-form-field appearance="outline" style="width:100%;">

    <mat-label>Nombre completo</mat-label>

    <input
      matInput
      [(ngModel)]="cliente.nombreCompleto">

  </mat-form-field>

  <mat-form-field appearance="outline" style="width:100%;">

    <mat-label>Correo</mat-label>

    <input
      matInput
      [(ngModel)]="cliente.email">

  </mat-form-field>

  <mat-form-field appearance="outline" style="width:100%;">

    <mat-label>Ciudad</mat-label>

    <input
      matInput
      [(ngModel)]="cliente.ciudad">

  </mat-form-field>

</mat-dialog-content>

<mat-dialog-actions align="end">

  <button mat-button (click)="cancelar()">

    Cancelar

  </button>

  <button
    mat-raised-button
    color="primary"
    (click)="guardar()">

    Guardar

  </button>

</mat-dialog-actions>
