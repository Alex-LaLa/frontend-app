<mat-card>
  <mat-card-header>

    <div class="header-clientes">

      <div class="titulo-productos">

        <mat-card-title>
          Clientes registrados
        </mat-card-title>

        <mat-card-subtitle>
          Sistema de Inventario
        </mat-card-subtitle>

      </div>

      <span class="contador">

      {{ dataSource.data.length }} clientes

    </span>

    </div>

  </mat-card-header>

  <mat-card-content>

    <div class="tabla-toolbar">

      <mat-form-field appearance="outline">

        <mat-label>Buscar cliente</mat-label>

        <input
          matInput
          placeholder="Buscar..."
          (keyup)="filtrar($event)">

        <mat-icon matSuffix>
          search
        </mat-icon>

      </mat-form-field>

      <button
        mat-raised-button
        color="primary"
        (click)="abrirDialogoCliente()">

        + Nuevo Cliente

      </button>

    </div>

    <table mat-table [dataSource]="dataSource" matSort>
      <!-- ID -->

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>

        <td mat-cell *matCellDef="let cliente">
          {{ cliente.id }}
        </td>
      </ng-container>

      <!-- Nombre -->

      <ng-container matColumnDef="nombreCompleto">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>

        <td mat-cell *matCellDef="let cliente">
          {{ cliente.nombreCompleto }}
        </td>
      </ng-container>

      <!-- Email -->

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>

        <td mat-cell *matCellDef="let cliente">
          {{ cliente.email }}
        </td>
      </ng-container>

      <!-- Ciudad -->

      <ng-container matColumnDef="ciudad">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Ciudad</th>

        <td mat-cell *matCellDef="let cliente">
          {{ cliente.ciudad }}
        </td>
      </ng-container>

      <!-- Acciones -->

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>

        <td mat-cell *matCellDef="let cliente">
          <button mat-icon-button color="primary" (click)="editarCliente(cliente)">
            <mat-icon>edit</mat-icon>
          </button>

          <button mat-icon-button color="warn" (click)="eliminarCliente(cliente)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnas"></tr>

      <tr mat-row *matRowDef="let _; columns: columnas"></tr>
    </table>
    <mat-paginator [pageSize]="10" [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons="true">
    </mat-paginator>
  </mat-card-content>
</mat-card>
